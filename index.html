<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Mythron Rogue</title>
    <!-- Duelyst UI font (CC0). Preload so Phaser text renders in Lato immediately. -->
    <link rel="preload" as="font" type="font/ttf" href="/resources/fonts/Lato-Regular.ttf" crossorigin />
    <link rel="preload" as="font" type="font/ttf" href="/resources/fonts/Lato-Bold.ttf" crossorigin />
    <style>
      @font-face {
        font-family: 'Lato';
        font-weight: 400;
        font-display: block;
        src: url('/resources/fonts/Lato-Regular.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Lato';
        font-weight: 700;
        font-display: block;
        src: url('/resources/fonts/Lato-Bold.ttf') format('truetype');
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #000;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
        touch-action: none; /* no pinch/scroll stealing drags from the canvas */
      }

      /* Portrait fallback: where the orientation API can't lock (iOS, browser tab),
         hide the game and ask for a rotate instead of playing letterboxed. */
      #rotate-gate { display: none; }
      @media (orientation: landscape) and (pointer: coarse) {
        canvas { display: none !important; }
        #rotate-gate {
          display: flex;
          position: fixed;
          inset: 0;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          background: #05060f;
          color: #e8e8f0;
          font: 700 20px/1.4 'Lato', sans-serif;
          text-align: center;
        }
        #rotate-gate .icon { font-size: 48px; }
      }
    </style>
  </head>
  <body>
    <!-- Phaser canvas is injected here by PhaserGame.ts -->
    <div id="rotate-gate">
      <div class="icon">📱</div>
      <div>Rotate your device to portrait</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
